id: S10
name: expire
description: An expired domain loses its delegation; renewing within the grace period restores it.
domains: [a]
steps:
  - provider_zone: {domain: "${a}"}
  - api:
      method: POST
      path: /domains
      body: {name: "${a}", owner: scenario, nameservers: [ns1.myhost.net, ns2.myhost.net]}
    expect: {status: 201}
  - verify: {domain: "${a}", expect: [ns1.myhost.net, ns2.myhost.net], status: VERIFIED, within: 30}
  - api: {method: POST, path: "/admin/domains/${a}/expire-now"}
    expect: {status: 200, json: {expired: true}}
  - verify: {domain: "${a}", expect: [ns1.myhost.net, ns2.myhost.net], status: NOT_DELEGATED, within: 30}
  - api: {method: POST, path: "/domains/${a}/renew", body: {years: 1}}
    expect: {status: 200, json: {expired: false}}
  - verify: {domain: "${a}", expect: [ns1.myhost.net, ns2.myhost.net], status: VERIFIED, within: 30}
