id: S12
name: never registered
description: A name that was never registered does not exist in DNS.
domains: [a]
steps:
  - dns: {server: resolver, name: "${a}", type: NS, rcode: NXDOMAIN}
  - dns: {server: registry, name: "${a}", type: NS, rcode: NXDOMAIN}
  - verify: {domain: "${a}", expect: [ns1.myhost.net, ns2.myhost.net], status: NXDOMAIN}
