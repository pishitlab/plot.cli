id: S09
name: hold
description: serverHold withdraws the delegation; release brings it back.
domains: [a]
steps:
  - provider_zone: {domain: "${a}"}
  - api:
      method: POST
      path: /domains
      body: {name: "${a}", owner: scenario, nameservers: [ns1.myhost.net, ns2.myhost.net]}
    expect: {status: 201}
  - verify: {domain: "${a}", expect: [ns1.myhost.net, ns2.myhost.net], status: VERIFIED, within: 30}
  - api: {method: PUT, path: "/domains/${a}/status", body: {add: [serverHold]}}
    expect: {status: 200, json: {status: [serverHold]}}
  - verify: {domain: "${a}", expect: [ns1.myhost.net, ns2.myhost.net], status: NOT_DELEGATED, within: 30}
  - api: {method: PUT, path: "/domains/${a}/status", body: {remove: [serverHold]}}
    expect: {status: 200}
  - verify: {domain: "${a}", expect: [ns1.myhost.net, ns2.myhost.net], status: VERIFIED, within: 30}
