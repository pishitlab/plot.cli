<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · plot</title>
  <link rel="stylesheet" href="{{ root }}static/style.css">
</head>
<body>
  <main class="narrow">
    <h1>Domain Sandbox</h1>
    {% if error %}<p class="flash error" role="alert">{{ error }}</p>{% endif %}
    {% if notice %}<p class="flash notice">{{ notice }}</p>{% endif %}
    <form method="post" action="{{ root }}login">
      <label>API key <input type="password" name="api_key" autocomplete="current-password" required autofocus></label>
      <button>Log in</button>
    </form>
    <p class="muted">The key is the <code>API_KEY</code> from the sandbox's <code>.env</code>.</p>
  </main>
</body>
</html>
