[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "plot"
version = "0.0.0"
description = "Domain Sandbox: simulated registrar, registry and DNS resolver for testing nameserver-based domain verification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "typer",
    "httpx",
    "dnspython",
    "pyyaml",
    "jinja2",
]

[project.scripts]
plot = "plot.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plot = [
    "py.typed",
    "db/migrations/script.py.mako",
    "scenarios/catalog/*.yml",
    "web/templates/*.html",
    "web/static/*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "T20"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["plot", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs Docker Compose stack (run with make test-integration)",
]
