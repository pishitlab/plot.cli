name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: make install PYTHON=python
      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test

  # F2 (docs/REVIEW.md): a clean clone must deploy with the repository's Dockerfiles as they
  # are, then pass the integration + scenario suites on the real stack.
  integration:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: make install PYTHON=python
      - name: Deploy (make deploy on a fresh clone)
        run: BIND_ADDR=127.0.0.1 make deploy
      - name: Deploy again (must be idempotent)
        run: SKIP_BUILD=1 make deploy
      - name: Integration and scenario tests
        run: make test-integration
      - name: Backup and restore
        run: |
          make backup
          make restore FILE="$(ls -t data/backups/*.db | head -n 1)"
          make smoke
      - name: Stack logs
        if: failure()
        run: docker compose --env-file .env --project-directory . -f deploy/docker-compose.yml logs --no-color --tail=200
      - name: Stop
        if: always()
        run: make down
