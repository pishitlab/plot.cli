# demo-ns: stand-in nameserver of a hosting provider (SPEC §4.2, D-012); not part of the registry.
# Checked against powerdns/pdns-auth-49:4.9.17. The image's startup script adds
# pdns.d/_api.conf (api, webserver, api-key) from PDNS_AUTH_API_KEY.
local-address=0.0.0.0
launch=gsqlite3
gsqlite3-database=/var/lib/powerdns/pdns.sqlite3
include-dir=/etc/powerdns/pdns.d
disable-axfr=yes
# No server-side caching: the sandbox controls visibility through propagation_delay and the
# resolver; pdns' own caches would hide fresh changes (defaults on 4.9.17: cache-ttl=20,
# query-cache-ttl=20, negquery-cache-ttl=60, zone-cache-refresh-interval=300).
cache-ttl=0
query-cache-ttl=0
negquery-cache-ttl=0
zone-cache-refresh-interval=0
# N8: no DNS queries leave the sandbox; the default (secpoll.powerdns.com.) polls PowerDNS
# for security notices on every start. Empty disables it (4.9.17 docs: "security-poll-suffix").
security-poll-suffix=
