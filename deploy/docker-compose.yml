# Domain Sandbox (SPEC §4.1, §4.3). Use the Makefile (`make deploy`, `make up`, ...), or:
#   docker compose --env-file .env --project-directory . -f deploy/docker-compose.yml up -d
# Published ports bind to BIND_ADDR only (N10); pdns API (8081) and unbound-control (8953)
# stay inside the compose network. Docker-published ports are NOT filtered by ufw; see
# docs/RUNBOOK.md §1.
name: plot

x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

x-pdns: &pdns
  # tag for humans, digest for reproducible pulls (checked 2026-10-23)
  image: powerdns/pdns-auth-49:4.9.17@sha256:b554df74bbde1afa7caedad4af9c91378be6d46d05807d089b3c7c443002e684
  restart: unless-stopped
  logging: *logging
  environment:
    PDNS_AUTH_API_KEY: ${PDNS_API_KEY:?set PDNS_API_KEY in .env}
  healthcheck:
    test: ["CMD", "pdns_control", "rping"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 20s

services:
  unbound:
    build: ./deploy/unbound
    image: plot-unbound:local
    restart: unless-stopped
    logging: *logging
    environment:
      PDNS_ROOT_IP: ${PDNS_ROOT_IP:-172.28.0.10}
      UPSTREAM_DNS: ${UPSTREAM_DNS:-1.1.1.1}
      CACHE_MAX_TTL: ${CACHE_MAX_TTL:-3600}
      RESOLVER_EXTRA_ALLOW: ${RESOLVER_EXTRA_ALLOW:-}
    volumes:
      - ./config/passthrough.txt:/etc/unbound/passthrough.txt:ro
    ports:
      - "${BIND_ADDR:?set BIND_ADDR in .env}:53:53/udp"
      - "${BIND_ADDR}:53:53/tcp"
    networks:
      sandbox:
        ipv4_address: ${UNBOUND_IP:-172.28.0.2}
    healthcheck:
      test: ["CMD", "unbound-control", "-c", "/etc/unbound/unbound.conf", "-s", "127.0.0.1@8953", "status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      pdns-root: {condition: service_healthy}

  pdns-root:
    <<: *pdns
    volumes:
      - ./deploy/pdns-root/pdns.conf:/etc/powerdns/pdns.conf:ro
      - pdns-root-data:/var/lib/powerdns
    ports:
      - "${BIND_ADDR}:5300:53/udp"
      - "${BIND_ADDR}:5300:53/tcp"
    networks:
      sandbox:
        ipv4_address: ${PDNS_ROOT_IP:-172.28.0.10}

  registrar:
    build:
      context: .
      dockerfile: deploy/registrar/Dockerfile
    image: plot-registrar:local
    restart: unless-stopped
    logging: *logging
    environment:
      API_KEY: ${API_KEY:?set API_KEY in .env}
      PDNS_API_KEY: ${PDNS_API_KEY}
      PDNS_ROOT_IP: ${PDNS_ROOT_IP:-172.28.0.10}
      SUBNET: ${SUBNET:-172.28.0.0/24}
      UPSTREAM_DNS: ${UPSTREAM_DNS:-1.1.1.1}
      PDNS_API_URL: http://pdns-root:8081
      UNBOUND_CONTROL_HOST: unbound
      DEMO_NS_API_URLS: http://demo-ns1:8081,http://demo-ns2:8081
      # `plot` (scenario, verify, ...) run inside this container talks to its neighbours
      PLOT_API_URL: http://localhost:8080
      PLOT_API_KEY: ${API_KEY}
      PLOT_RESOLVER: ${UNBOUND_IP:-172.28.0.2}
      PLOT_REGISTRY_ADDR: ${PDNS_ROOT_IP:-172.28.0.10}:53
      PLOT_DEMO_NS1_IP: ${DEMO_NS1_IP:-172.28.0.31}
      PLOT_DEMO_NS2_IP: ${DEMO_NS2_IP:-172.28.0.32}
      PLOT_LAME_IP: ${LAME_IP:-172.28.0.99}
    volumes:
      - ${DATA_DIR:-./data}:/data
    ports:
      - "${BIND_ADDR}:8080:8080"
    networks:
      sandbox:
        ipv4_address: ${REGISTRAR_IP:-172.28.0.20}
    healthcheck:
      # the HTTP server answers; dependencies are reported inside /health itself
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      pdns-root: {condition: service_healthy}
      unbound: {condition: service_healthy}

  demo-ns1:
    <<: *pdns
    volumes:
      - ./deploy/demo-ns/pdns.conf:/etc/powerdns/pdns.conf:ro
      - demo-ns1-data:/var/lib/powerdns
    networks:
      sandbox:
        ipv4_address: ${DEMO_NS1_IP:-172.28.0.31}

  demo-ns2:
    <<: *pdns
    volumes:
      - ./deploy/demo-ns/pdns.conf:/etc/powerdns/pdns.conf:ro
      - demo-ns2-data:/var/lib/powerdns
    networks:
      sandbox:
        ipv4_address: ${DEMO_NS2_IP:-172.28.0.32}

networks:
  sandbox:
    ipam:
      config:
        - subnet: ${SUBNET:-172.28.0.0/24}

volumes:
  pdns-root-data:
  demo-ns1-data:
  demo-ns2-data:
